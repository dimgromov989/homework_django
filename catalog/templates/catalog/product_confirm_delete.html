{% extends 'catalog/base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <form method="post" enctype="multipart/form-data">
                    <div class="card-body form-content">
                      <p class="card-text text-muted mb-3">Вы уверены, что хотите удалить {{ object.name }} ?</p>
                        {% csrf_token %}
                    </div>
                    <div class="card-footer bg-light text-center py-3">
                        <div class="d-grid gap-2 d-md-block">
                            <button type="submit" class="btn btn-primary px-4">Удалить</button>
                          <a href="{% url 'catalog:product_list' %}" class="btn btn-secondary px-4">Отмена</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
