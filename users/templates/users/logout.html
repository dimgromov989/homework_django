{% extends 'catalog/base.html' %}
{% block action_button %}{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body text-center">
                    <h2 class="h4 mb-3">Выход из аккаунта</h2>
                    <p class="text-body-secondary mb-0">
                        Нажми на кнопку ниже, чтобы безопасно завершить текущую сессию.
                    </p>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <form method="post" action="{% url 'users:logout_confirm' %}">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-block">
                            <button type="submit" class="btn btn-primary px-4">
                                Выйти
                            </button>
                            <a href="{% url 'catalog:product_list' %}" class="btn btn-outline-secondary px-4">
                                Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
